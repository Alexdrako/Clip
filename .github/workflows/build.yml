name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate && ls -la Clip.xcodeproj/project.pbxproj

      - name: Fetch binaries into Resources/bin
        run: |
          bash scripts/fetch_binaries.sh Clip/Resources/bin || true
          ls -la Clip/Resources/bin

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Clip.xcodeproj \
                     -scheme Clip \
                     -configuration Release \
                     -destination 'generic/platform=macOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     build | tee build.log

      - name: Assemble artifact
        if: success()
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Clip.app" -path "*Release*" | head -1)
          echo "Found app at $APP"
          mkdir -p stage
          cp -R "$APP" stage/Clip.app
          cd stage && zip -qry ../Clip-macOS.zip Clip.app

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Clip-macOS
          path: Clip-macOS.zip
