name: Clip
options:
  bundleIdPrefix: com.alexdrako
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.9
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.alexdrako.Clip
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: NO

targets:
  Clip:
    type: application
    platform: macOS
    sources:
      - path: Clip
    settings:
      base:
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Clip надсилає Apple Events для інтеграції з браузером."
        INFOPLIST_KEY_NSSystemAdministrationUsageDescription: "Clip потребує доступу для завантаження відео."
        # Bundled binaries live in Resources/bin — copied via buildPhase script below.
        CODE_SIGN_ENTITLEMENTS: Clip/Clip.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Resources"
    preBuildScripts:
      - name: FetchBinaries
        # Runs on every build; downloads are cached in DerivedData.
        script: |
          if [ ! -f "$BUILT_PRODUCTS_DIR/yt-dlp" ]; then
            bash "$SRCROOT/scripts/fetch_binaries.sh" "$BUILT_PRODUCTS_DIR/bin"
          fi
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/bin/yt-dlp
